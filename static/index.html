<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Papers</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Next:wght@400;700;800&family=STIX+Two+Text:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.4.168/pdf_viewer.min.css">
  <link rel="stylesheet" href="/style.css">
  <script>try { const t = localStorage.getItem("papers.theme"); if (t) document.documentElement.dataset.theme = t; } catch {}</script>
</head>
<body>
  <header class="site-header">
    <div class="header-inner">
      <div class="bar-start" id="bar-start"><a href="#/" class="wordmark">Papers</a></div>
      <nav class="nav segmented small" aria-label="Sections">
        <a href="#/" data-nav="library">Library</a>
        <a href="#/goals" data-nav="goals">Goals</a>
        <a href="#/map" data-nav="map">Map</a>
        <a href="#/recall" data-nav="recall">Recall</a>
        <a href="#/settings" data-nav="settings">Settings</a>
      </nav>
    </div>
  </header>
  <main id="app"></main>
  <div class="theme-switch" role="group" aria-label="Theme"><span class="theme-thumb"></span><button type="button" data-theme-pick="light">Light</button><button type="button" data-theme-pick="dim">Dim</button><button type="button" data-theme-pick="dark">Dark</button></div>
  <div id="toast" role="status" hidden></div>
  <div id="drop-zone" hidden><p>Drop PDFs to add them to your library</p></div>
  <script type="module" src="/js/main.js"></script>
</body>
</html>
