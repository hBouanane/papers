[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "papers-app"
dynamic = ["version"]
description = "An AI reading companion for research papers: skim, read, ask, recall. Runs on your computer."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "hBouanane" }]
keywords = ["research", "papers", "pdf", "reading", "ai", "llm"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Web Environment",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering",
]
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "httpx>=0.27",
  "pypdf>=5",
  "fonttools>=4",  # pypdf reads some embedded fonts' encodings with it
  "pdfplumber>=0.11",
  "anthropic>=0.40",
  "python-multipart>=0.0.9",
  "keyring>=24",
  "rich>=13",
  "questionary>=2",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
papers = "papers.cli:main"
papers-app = "papers.cli:main"  # so `uvx papers-app` finds it

[project.urls]
Homepage = "https://github.com/hBouanane/papers"
Issues = "https://github.com/hBouanane/papers/issues"

[tool.hatch.version]
path = "papers/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["papers"]

[tool.hatch.build.targets.sdist]
include = ["papers", "tests", "README.md", "LICENSE", "CONTRIBUTING.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501", "E731", "E741", "B008", "B904", "B905", "UP031"]

[tool.ruff.lint.isort]
known-first-party = ["papers"]
