<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Papers</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Next:wght@400;700;800&family=STIX+Two+Text:ital,wght@0,400;0,600;1,400&family=Noto+Sans+Arabic:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.4.168/pdf_viewer.min.css">
  <!-- Styles by area; later files build on earlier ones (tokens and base first). -->
  <link rel="stylesheet" href="/css/tokens.css">
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/components.css">
  <link rel="stylesheet" href="/css/library.css">
  <link rel="stylesheet" href="/css/goals.css">
  <link rel="stylesheet" href="/css/recall.css">
  <link rel="stylesheet" href="/css/map.css">
  <link rel="stylesheet" href="/css/paper.css">
  <link rel="stylesheet" href="/css/reader.css">
  <link rel="stylesheet" href="/css/settings.css">
  <link rel="stylesheet" href="/css/chat.css">
  <script>try { const t = localStorage.getItem("papers.theme"); if (t) document.documentElement.dataset.theme = t; } catch {}</script>
</head>
<body>
  <header class="site-header">
    <div class="header-inner">
      <div class="bar-start" id="bar-start"><a href="#/" class="wordmark">Papers</a></div>
      <nav class="nav segmented small" aria-label="Sections">
        <a href="#/" data-nav="library">Library</a>
        <a href="#/goals" data-nav="goals">Goals</a>
        <a href="#/map" data-nav="map">Map</a>
        <a href="#/recall" data-nav="recall">Recall</a>
        <a href="#/settings" data-nav="settings">Settings</a>
      </nav>
    </div>
  </header>
  <main id="app"></main>
  <div class="theme-switch" role="group" aria-label="Theme"><span class="theme-thumb"></span><button type="button" data-theme-pick="light" aria-label="Light" title="Light"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></button><button type="button" data-theme-pick="dim" aria-label="Dim" title="Dim"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="8"/><path d="M12 4a8 8 0 0 1 0 16z" fill="currentColor"/></svg></button><button type="button" data-theme-pick="dark" aria-label="Dark" title="Dark"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/></svg></button></div>
  <div id="toast" role="status" hidden></div>
  <div id="drop-zone" hidden><p>Drop PDFs to add them to your library</p></div>
  <script type="module" src="/js/main.js"></script>
</body>
</html>
